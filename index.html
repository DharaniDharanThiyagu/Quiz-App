<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Simple quiz</h1>
        <div class="quiz">
            <div class="topbar">
                <span class="tag">Quiz challenge</span>
                <span id="score">Score: 0</span>
            </div>

            <h1>Simple quiz</h1>

            <div class="progress" aria-label="Quiz progress">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <p id="question-number" class="question-number">Question 1 / 1</p>
            <h2 id="question">Loading question...</h2>
            <div id="answer-buttons" class="answer-buttons" aria-live="polite">
                <button class="answer-btn" type="button">Answer 1</button>
                <button class="answer-btn" type="button">Answer 2</button>
                <button class="answer-btn" type="button">Answer 3</button>
                <button class="answer-btn" type="button">Answer 4</button>
            </div>
            <div class="controls">
                <button id="next-btn" class="next-btn" type="button">Next</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
